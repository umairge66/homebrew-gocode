name: test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    name: brew install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Homebrew (Linux)
        if: runner.os == 'Linux'
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      - name: Install from this tap
        env:
          # gocode update --check asks the GitHub API for the latest release;
          # without a token, shared runners often hit the 60-an-hour limit.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          brew tap-new --no-git local/gocode
          cp Formula/gocode.rb "$(brew --repository)/Library/Taps/local/homebrew-gocode/Formula/"
          brew install local/gocode/gocode
          brew test local/gocode/gocode
          gocode --version
          gocode update --check
